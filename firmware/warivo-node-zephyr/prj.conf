# Warivo Node — Zephyr build config (ESP32-C6).
#
# The same telemetry node as ../warivo-node (Arduino/NimBLE), rebuilt on a real RTOS:
# Zephyr's scheduler + its own Bluetooth host, instead of the Arduino core over ESP-IDF.
# The BLE contract (service fff0, telemetry notify + gps/config/lock writes) is identical,
# so the phone app talks to either firmware unchanged.

# ---- Bluetooth LE peripheral ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Warivo-Node"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_ATT_PREPARE_COUNT=2

# One telemetry frame must fit a single notification (there is no reassembly in the app),
# so raise the ATT MTU well above the 23-byte default. The client drives the exchange; a
# peer that negotiates lower simply lands lower.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=n

# ---- On-board peripherals ----
CONFIG_GPIO=y
CONFIG_ADC=y

# ---- printf needs %f for the JSON frame; ESP32-C6 is soft-float RISC-V ----
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Console / logging ----
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_BT_DEVICE_APPEARANCE=0

# ---- Stacks / heap ----
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
