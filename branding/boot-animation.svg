<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warivo OS boot">
  <title>Warivo OS boot animation (landscape)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1B40"/>
      <stop offset="0.55" stop-color="#061230"/>
      <stop offset="1" stop-color="#03081C"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC0CB"/>
      <stop offset="1" stop-color="#FF8FA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC0CB" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFC0CB" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face{ font-family:'Warivo Script'; src:url('fonts/KaushanScript-Regular.ttf') format('truetype'); }
      .sig{ font-family:'Warivo Script','Segoe Script',cursive; }
    </style>
    <clipPath id="reveal">
      <rect x="620" y="560" width="0" height="230">
        <animate attributeName="width" values="0;720" dur="1.7s" begin="1.4s"
                 calcMode="spline" keySplines="0.66 0 0.34 1" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="barclip">
      <rect x="810" y="946" width="300" height="6" rx="3"/>
    </clipPath>
  </defs>

  <!-- Deep Space background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="410" r="300" fill="url(#glow)">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </circle>

  <!-- Blush orbit ring (draws in) -->
  <circle cx="960" cy="410" r="120" fill="none" stroke="url(#aqua)" stroke-width="5"
          stroke-linecap="round" stroke-opacity="0.9"
          stroke-dasharray="754" stroke-dashoffset="754"
          transform="rotate(-90 960 410)">
    <animate attributeName="stroke-dashoffset" values="754;0" dur="1.0s" begin="0.2s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </circle>

  <!-- W monogram (draws in) -->
  <polyline points="885,363 922,458 960,375 998,458 1035,363" fill="none"
            stroke="url(#aqua)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="390" stroke-dashoffset="390">
    <animate attributeName="stroke-dashoffset" values="390;0" dur="1.1s" begin="0.5s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </polyline>

  <!-- Signature wordmark — writes on left→right -->
  <g clip-path="url(#reveal)">
    <text class="sig" x="960" y="720" text-anchor="middle" fill="#EAF2FF" font-size="150">Warivo</text>
  </g>
  <circle cx="700" cy="708" r="8" fill="#FFF2F5" opacity="0">
    <animate attributeName="cx" values="700;1200" dur="1.7s" begin="1.4s"
             calcMode="spline" keySplines="0.66 0 0.34 1" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1"
             dur="1.7s" begin="1.4s" fill="freeze"/>
  </circle>

  <!-- Model badge -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
    <text x="960" y="820" fill="#8FB0D8" font-size="34" font-weight="600" letter-spacing="20">NOVA-S</text>
  </g>

  <!-- OS boot progress: indeterminate bar + micro wordmark -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.6s" fill="freeze"/>
    <rect x="810" y="946" width="300" height="6" rx="3" fill="#FFC0CB" opacity="0.2"/>
    <g clip-path="url(#barclip)">
      <rect x="690" y="946" width="120" height="6" rx="3" fill="url(#aqua)">
        <animate attributeName="x" values="690;1110" dur="1.25s" begin="3.6s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.65 0.05 0.35 1"/>
      </rect>
    </g>
    <text x="960" y="1000" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          fill="#4C688F" font-size="20" font-weight="600" letter-spacing="8">WARIVO OS</text>
  </g>
</svg>
