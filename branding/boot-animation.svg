<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warivo OS boot">
  <title>Warivo OS boot animation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1B40"/>
      <stop offset="0.55" stop-color="#061230"/>
      <stop offset="1" stop-color="#03081C"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FF0DE"/>
      <stop offset="1" stop-color="#1FB6C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2FD3C8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2FD3C8" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face{ font-family:'Warivo Script'; src:url('fonts/KaushanScript-Regular.ttf') format('truetype'); }
      .sig{ font-family:'Warivo Script','Segoe Script',cursive; }
    </style>
    <clipPath id="reveal">
      <rect x="200" y="900" width="0" height="320">
        <animate attributeName="width" values="0;720" dur="1.7s" begin="1.4s"
                 calcMode="spline" keySplines="0.66 0 0.34 1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Deep Space background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="540" cy="690" r="360" fill="url(#glow)">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </circle>

  <!-- Celestial Aqua orbit ring (draws in) -->
  <circle cx="540" cy="690" r="170" fill="none" stroke="url(#aqua)" stroke-width="6"
          stroke-linecap="round" stroke-opacity="0.9"
          stroke-dasharray="1068" stroke-dashoffset="1068"
          transform="rotate(-90 540 690)">
    <animate attributeName="stroke-dashoffset" values="1068;0" dur="1.0s" begin="0.2s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </circle>

  <!-- W monogram (draws in) -->
  <polyline points="440,625 490,755 540,660 590,755 640,625" fill="none"
            stroke="url(#aqua)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" values="500;0" dur="1.1s" begin="0.5s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </polyline>

  <!-- Signature wordmark — writes on left→right -->
  <g clip-path="url(#reveal)">
    <text class="sig" x="540" y="1080" text-anchor="middle" fill="#EAF2FF" font-size="180">Warivo</text>
  </g>
  <circle cx="250" cy="1066" r="10" fill="#EAFFFB" opacity="0">
    <animate attributeName="cx" values="250;830" dur="1.7s" begin="1.4s"
             calcMode="spline" keySplines="0.66 0 0.34 1" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1"
             dur="1.7s" begin="1.4s" fill="freeze"/>
  </circle>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <!-- Aqua underline sweep -->
    <rect x="330" y="1120" width="420" height="6" rx="3" fill="url(#aqua)"
          transform="scale(1,1)" transform-origin="540 1123">
      <animateTransform attributeName="transform" type="scale" values="0 1;1 1"
                        dur="0.5s" begin="3.1s" calcMode="spline" keySplines="0.3 0 0 1" fill="freeze"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
      <text x="540" y="1195" fill="#8FB0D8" font-size="40" font-weight="600"
            letter-spacing="24">NOVA-S</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.7s" fill="freeze"/>
      <text x="540" y="1260" fill="#5E7BA6" font-size="30" font-weight="500"
            letter-spacing="4">Effortless Elegance &#183; Practical Luxury</text>
    </g>
  </g>

  <!-- Boot loader -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.0s" fill="freeze"/>
    <text x="540" y="1780" fill="#4C688F" font-size="26" font-weight="600" letter-spacing="6">WARIVO OS</text>
    <circle cx="510" cy="1815" r="6" fill="#2FD3C8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="1815" r="6" fill="#2FD3C8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570" cy="1815" r="6" fill="#2FD3C8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
