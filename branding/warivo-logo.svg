<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="Warivo Nova-S">
  <title>Warivo Nova-S logo</title>
  <defs>
    <linearGradient id="wl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E45"/>
      <stop offset="1" stop-color="#05102A"/>
    </linearGradient>
    <linearGradient id="wl-aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC0CB"/>
      <stop offset="1" stop-color="#FF8FA8"/>
    </linearGradient>
    <style>
      @font-face{ font-family:'Warivo Script'; src:url('fonts/KaushanScript-Regular.ttf') format('truetype'); }
      .sig{ font-family:'Warivo Script','Segoe Script',cursive; }
    </style>
  </defs>

  <!-- Mark -->
  <g transform="translate(15,15)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#wl-bg)"/>
    <rect x="0.5" y="0.5" width="119" height="119" rx="27.5" fill="none" stroke="#FF8FA8" stroke-opacity="0.35"/>
    <circle cx="60" cy="60" r="41" fill="none" stroke="url(#wl-aqua)" stroke-opacity="0.28" stroke-width="2"/>
    <polyline points="30,42 44,82 60,54 76,82 90,42" fill="none"
              stroke="url(#wl-aqua)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g>
    <text class="sig" x="158" y="96" fill="#EAF2FF" font-size="78">Warivo</text>
    <rect x="162" y="110" width="250" height="3" rx="1.5" fill="url(#wl-aqua)"/>
    <text x="165" y="136" fill="#7FA0C8" font-size="20" font-weight="600"
          font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" letter-spacing="13">NOVA-S</text>
  </g>
</svg>
