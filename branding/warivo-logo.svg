<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="Warivo Nova-S">
  <title>Warivo Nova-S logo</title>
  <defs>
    <linearGradient id="wl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E45"/>
      <stop offset="1" stop-color="#05102A"/>
    </linearGradient>
    <linearGradient id="wl-aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FF0DE"/>
      <stop offset="1" stop-color="#1FB6C9"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(15,15)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#wl-bg)"/>
    <rect x="0.5" y="0.5" width="119" height="119" rx="27.5" fill="none" stroke="#1FB6C9" stroke-opacity="0.35"/>
    <circle cx="60" cy="60" r="41" fill="none" stroke="url(#wl-aqua)" stroke-opacity="0.28" stroke-width="2"/>
    <polyline points="30,42 44,82 60,54 76,82 90,42" fill="none"
              stroke="url(#wl-aqua)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="160" y="82" fill="#EAF2FF" font-size="58" font-weight="700"
          letter-spacing="10">WARIVO</text>
    <rect x="162" y="98" width="300" height="3" rx="1.5" fill="url(#wl-aqua)"/>
    <text x="163" y="126" fill="#7FA0C8" font-size="22" font-weight="600"
          letter-spacing="14">NOVA-S</text>
  </g>
</svg>
