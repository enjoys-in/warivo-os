<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Warivo OS — Dashboard</title>
<link rel="stylesheet" href="warivo.css"/>
<style>
  .cluster{display:flex;gap:22px;width:100%}
  /* Speed */
  .c-speed{flex:0 0 500px;display:flex;flex-direction:column;gap:18px}
  .gauge-card{flex:1;position:relative;display:grid;place-items:center;padding:18px}
  .gauge{width:100%;max-width:440px;aspect-ratio:1/1}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;transform:translateY(4px)}
  .gauge-center .big{font-size:172px;font-weight:800;line-height:.82;letter-spacing:-6px}
  .gauge-center .u{font-size:19px;font-weight:800;letter-spacing:7px;color:var(--dim);margin-top:8px}
  .tell{display:flex;gap:12px;justify-content:center}
  .tl{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
    background:rgba(10,24,54,.55);border:1px solid var(--line);color:var(--dim)}
  .tl svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .tl.on-pink{color:var(--aqua);border-color:rgba(255,143,168,.4);box-shadow:0 0 16px rgba(255,143,168,.22)}
  .tl.on-green{color:var(--green);border-color:rgba(87,226,138,.4)}
  .tl.on-blue{color:var(--blue);border-color:rgba(77,163,255,.4)}

  /* Battery */
  .c-mid{flex:1;display:flex;flex-direction:column;gap:20px}
  .batt-card{flex:1;display:flex;align-items:center;gap:10px;padding:26px 30px;position:relative}
  .ring-wrap{position:relative;flex:0 0 300px;display:grid;place-items:center}
  .ring{width:300px;height:300px}
  .ring-center{position:absolute;display:flex;flex-direction:column;align-items:center}
  .ring-center .p{font-size:96px;font-weight:800;line-height:.9;color:var(--green)}
  .ring-center .p small{font-size:36px}
  .ring-center .v{font-size:16px;font-weight:800;letter-spacing:2px;color:var(--dim);margin-top:6px}
  .batt-info{flex:1;display:flex;flex-direction:column;gap:14px;padding-left:10px}
  .batt-info .km{font-size:76px;font-weight:800;line-height:.9}
  .batt-info .km span{font-size:26px;color:var(--dim);font-weight:700}
  .bars{display:flex;gap:5px}
  .bars i{height:14px;flex:1;border-radius:7px;background:rgba(154,166,196,.2)}
  .bars i.f{background:linear-gradient(90deg,var(--aqua-deep),var(--aqua))}
  .mode-card{padding:16px}

  /* Stat rail */
  .c-right{flex:0 0 288px;display:flex;flex-direction:column;gap:16px}
  .stat{flex:1;display:flex;align-items:center;gap:18px;padding:20px 24px}
  .stat .si{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    background:rgba(255,143,168,.12);color:var(--aqua);flex:0 0 auto}
  .stat .si svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .stat .sv{font-size:36px;font-weight:800;line-height:1}
  .stat .sv span{font-size:17px;color:var(--dim);font-weight:700}
  .stat .sl{margin-top:4px}
</style>
</head>
<body>
<div class="os">
  <div class="stage">
    <div class="screen">
      <div class="cluster">
        <!-- SPEED -->
        <div class="c-speed">
          <div class="card gauge-card">
            <svg class="gauge" viewBox="0 0 300 300">
              <defs><linearGradient id="spd" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#FF8FA8"/><stop offset="1" stop-color="#FFC0CB"/>
              </linearGradient></defs>
              <path d="M65 235 A120 120 0 1 1 235 235" pathLength="100" fill="none"
                    stroke="rgba(154,166,196,.16)" stroke-width="20" stroke-linecap="round"/>
              <path d="M65 235 A120 120 0 1 1 235 235" pathLength="100" fill="none"
                    stroke="url(#spd)" stroke-width="20" stroke-linecap="round"
                    stroke-dasharray="52.5 100" style="filter:drop-shadow(0 0 8px rgba(255,143,168,.55))"/>
            </svg>
            <div class="gauge-center">
              <div class="big">42</div><div class="u">KM / H</div>
            </div>
          </div>
          <div class="card mode-card">
            <div class="seg"><div class="s">ECO</div><div class="s">CITY</div><div class="s on">SPORT</div></div>
          </div>
          <div class="card card-pad tell">
            <div class="tl on-pink"><svg viewBox="0 0 24 24"><path d="M4 12h6M14 8h3a4 4 0 0 1 0 8h-3M14 6v12"/></svg></div>
            <div class="tl on-green"><svg viewBox="0 0 24 24"><path d="M11 3 4 14h6l-1 7 8-12h-6z"/></svg></div>
            <div class="tl on-blue"><svg viewBox="0 0 24 24"><path d="M14 5l-7 7 7 7"/></svg></div>
            <div class="tl on-blue"><svg viewBox="0 0 24 24"><path d="M10 5l7 7-7 7"/></svg></div>
            <div class="tl"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-4 10c1 1 1.5 2 1.5 3h5c0-1 .5-2 1.5-3a6 6 0 0 0-4-10z"/><path d="M9.5 20h5"/></svg></div>
          </div>
        </div>

        <!-- BATTERY -->
        <div class="c-mid">
          <div class="card batt-card">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 300 300">
                <defs><linearGradient id="soc" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0" stop-color="#1FB6C9"/><stop offset="1" stop-color="#57E28A"/>
                </linearGradient></defs>
                <path d="M65 235 A120 120 0 1 1 235 235" pathLength="100" fill="none"
                      stroke="rgba(154,166,196,.16)" stroke-width="18" stroke-linecap="round"/>
                <path d="M65 235 A120 120 0 1 1 235 235" pathLength="100" fill="none"
                      stroke="url(#soc)" stroke-width="18" stroke-linecap="round"
                      stroke-dasharray="78 100" style="filter:drop-shadow(0 0 8px rgba(87,226,138,.45))"/>
              </svg>
              <div class="ring-center"><div class="p">78<small>%</small></div><div class="v">61.4 V · BATTERY</div></div>
            </div>
            <div class="batt-info">
              <div class="label">Estimated range</div>
              <div class="km">42<span> km</span></div>
              <div class="bars"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i></div>
              <div class="label" style="margin-top:2px">Eco reserve · 6 km</div>
            </div>
          </div>
        </div>

        <!-- STAT RAIL -->
        <div class="c-right">
          <div class="card stat">
            <div class="si"><svg viewBox="0 0 24 24"><path d="M4 20a8 8 0 0 1 16 0"/><path d="M12 12v-2"/><circle cx="12" cy="20" r="1"/></svg></div>
            <div><div class="sv">1.2<span> kW</span></div><div class="label sl">Power</div></div>
          </div>
          <div class="card stat">
            <div class="si"><svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></div>
            <div><div class="sv">12.4<span> km</span></div><div class="label sl">Trip</div></div>
          </div>
          <div class="card stat">
            <div class="si"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
            <div><div class="sv">1284<span> km</span></div><div class="label sl">Odometer</div></div>
          </div>
          <div class="card stat">
            <div class="si"><svg viewBox="0 0 24 24"><path d="M14 14V5a2 2 0 0 0-4 0v9a4 4 0 1 0 4 0z"/></svg></div>
            <div><div class="sv">38<span> °C</span></div><div class="label sl">Motor temp</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOP STATUS -->
  <div class="topbar">
    <div class="clock"><span class="t">14:32</span><span class="d">Sun · 21 Sep · 29°C</span></div>
    <div class="sp"></div>
    <div class="stat">
      <div class="chip live"><span class="dot"></span>Warivo-Node</div>
      <div class="sig">
        <svg class="on" viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-10a6 6 0 1 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M6.5 7.5 17 17l-5 4V3l5 4-10.5 9.5"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
      <div class="avatar">W</div>
    </div>
  </div>

  <!-- DOCK -->
  <div class="dock">
    <div class="dock-apps">
      <a href="00-home.html" class="brand"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="none" stroke="#FFC0CB" stroke-width="7"/><polyline points="30,42 44,82 60,54 76,82 90,42" fill="none" stroke="#FFC0CB" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="00-home.html" class="tile"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg></a>
      <a href="02-dashboard.html" class="tile active"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4.5-3.5"/><circle cx="12" cy="15" r="1.3"/></svg></a>
      <a href="03-map.html" class="tile"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg></a>
      <a href="04-music.html" class="tile"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></a>
      <a href="05-search.html" class="tile"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></a>
      <a href="06-settings.html" class="tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a>
    </div>
    <div class="dock-ctrl">
      <div class="ctrl on"><svg viewBox="0 0 24 24"><path d="M2 8h3M2 12h4M2 16h3"/><path d="M9 6a6 6 0 0 1 0 12h-1V6z"/></svg></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <div class="sep"></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8M20 5a9 9 0 0 1 0 14"/></svg></div>
    </div>
  </div>
</div>
<script src="fit.js"></script>
<script src="actions.js"></script>
</body>
</html>
