<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Warivo OS — Search</title>
<link rel="stylesheet" href="warivo.css"/>
<style>
  .content{flex-direction:column;align-items:center;padding-top:0;justify-content:flex-start}
  .search-wrap{width:100%;max-width:1040px;display:flex;flex-direction:column;
    align-items:center;padding-top:40px}

  .wordmark{font-family:'Warivo Script',cursive;font-size:96px;line-height:1;
    color:var(--text);filter:drop-shadow(0 6px 26px rgba(95,240,222,.22))}
  .wordmark .os{font-family:-apple-system,"Segoe UI",sans-serif;font-size:20px;font-weight:700;
    letter-spacing:8px;color:var(--dim);display:block;text-align:center;margin-top:6px}
  .powered{color:var(--dim);font-size:15px;font-weight:600;margin-top:14px;letter-spacing:.4px}

  .searchbar{margin-top:38px;width:100%;height:84px;border-radius:44px;display:flex;
    align-items:center;gap:18px;padding:0 12px 0 30px;
    background:linear-gradient(160deg, rgba(20,44,92,.95), rgba(11,30,69,.9));
    border:1.5px solid rgba(95,240,222,.35);
    box-shadow:0 22px 50px rgba(2,8,22,.5), 0 0 0 6px rgba(95,240,222,.06)}
  .searchbar .mag{color:var(--dim)}
  .searchbar .mag svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}
  .searchbar .q{flex:1;font-size:30px;font-weight:500;color:var(--text)}
  .searchbar .q .caret{display:inline-block;width:2px;height:34px;background:var(--aqua);
    vertical-align:middle;margin-left:2px}
  .searchbar .q .ph{color:var(--dim)}
  .searchbar .mic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--aqua),var(--aqua-deep))}
  .searchbar .mic svg{width:28px;height:28px;stroke:#05102A;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}

  .chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .chip-btn{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:22px;
    background:rgba(20,44,92,.7);border:1px solid rgba(95,240,222,.12);
    font-size:18px;font-weight:600;color:var(--text)}
  .chip-btn svg{width:20px;height:20px;stroke:var(--aqua);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  .recents{width:100%;margin-top:34px}
  .recents .r-lab{color:var(--dim);font-size:13px;font-weight:800;letter-spacing:1.6px;
    padding-left:8px;margin-bottom:6px}
  .r-item{display:flex;align-items:center;gap:20px;padding:18px 24px;border-radius:20px}
  .r-item + .r-item{border-top:1px solid rgba(95,240,222,.06)}
  .r-item .r-ico{color:var(--dim)}
  .r-item .r-ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .r-item .r-txt{flex:1;font-size:22px;font-weight:500}
  .r-item .r-go{color:var(--dim)}
  .r-item .r-go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <!-- RAIL -->
  <div class="rail">
    <div class="brand">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="none" stroke="#5FF0DE" stroke-width="7"/><polyline points="30,42 44,82 60,54 76,82 90,42" fill="none" stroke="#5FF0DE" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="nav">
      <div class="rail-btn"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4.5-3.5"/><circle cx="12" cy="15" r="1.3"/></svg></div>
      <div class="rail-btn"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg></div>
      <div class="rail-btn"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
      <div class="rail-btn active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
    </div>
    <div class="rail-btn" style="margin-bottom:8px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
    <div class="foot"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></div>
  </div>

  <div class="main">
    <div class="status">
      <div class="time">14:32</div>
      <div class="chip live"><span class="dot"></span>Warivo-Node</div>
      <div class="spacer"></div>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M14 14V5a2 2 0 0 0-4 0v9a4 4 0 1 0 4 0z"/></svg>29°C</div>
      <div class="ico">
        <svg class="on" viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-10a6 6 0 1 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M6.5 7.5 17 17l-5 4V3l5 4-10.5 9.5"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
    </div>

    <div class="content">
      <div class="search-wrap">
        <div class="wordmark">Warivo<span class="os">S E A R C H</span></div>
        <div class="powered">Google &middot; the only window to the web on this device</div>

        <div class="searchbar">
          <div class="mag"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
          <div class="q">charging stations near<span class="ph"> </span><span class="caret"></span></div>
          <div class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg></div>
        </div>

        <div class="chips">
          <div class="chip-btn"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>Weather</div>
          <div class="chip-btn"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-10a6 6 0 1 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>Directions home</div>
          <div class="chip-btn"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>Nearest charger</div>
          <div class="chip-btn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>News</div>
        </div>

        <div class="card recents" style="margin-top:34px">
          <div style="padding:18px 24px 4px" class="r-lab">RECENT SEARCHES</div>
          <div class="r-item">
            <div class="r-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
            <div class="r-txt">e-scooter battery care tips</div>
            <div class="r-go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div>
          </div>
          <div class="r-item">
            <div class="r-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
            <div class="r-txt">weather Bengaluru today</div>
            <div class="r-go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div>
          </div>
          <div class="r-item">
            <div class="r-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
            <div class="r-txt">60V lithium range calculator</div>
            <div class="r-go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
