<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Warivo OS — Search</title>
<link rel="stylesheet" href="warivo.css"/>
<style>
  .search{width:100%;display:flex;flex-direction:column;align-items:center}
  .glogo{display:flex;align-items:baseline;gap:2px;margin-top:20px;
    font-size:56px;font-weight:600;letter-spacing:-1px}
  .glogo b{font-weight:700}
  .brandline{color:var(--dim);font-size:16px;font-weight:600;margin-top:12px;letter-spacing:.3px}

  .searchbar{margin-top:34px;width:100%;max-width:1000px;height:82px;border-radius:42px;
    display:flex;align-items:center;gap:18px;padding:0 12px 0 28px;
    background:linear-gradient(160deg, rgba(24,48,96,.6), rgba(12,30,66,.5));
    border:1.5px solid rgba(255,143,168,.35);
    box-shadow:0 22px 50px rgba(2,8,22,.5), 0 0 0 6px rgba(255,143,168,.06);backdrop-filter:blur(20px)}
  .searchbar .mag{color:var(--dim)}
  .searchbar .mag svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .searchbar .q{flex:1;font-size:30px;font-weight:500}
  .searchbar .q .caret{display:inline-block;width:2px;height:34px;background:var(--aqua);vertical-align:middle;margin-left:2px}
  .searchbar .lens{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,143,168,.12);color:var(--aqua)}
  .searchbar .lens svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .searchbar .mic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--aqua),var(--aqua-deep))}
  .searchbar .mic svg{width:28px;height:28px;stroke:#05102A;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:24px;max-width:1000px}
  .chip-btn{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:22px;
    background:rgba(20,40,82,.6);border:1px solid var(--line);font-size:18px;font-weight:600;backdrop-filter:blur(10px)}
  .chip-btn svg{width:20px;height:20px;stroke:var(--aqua);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .recents{width:100%;max-width:1000px;margin-top:28px}
  .rl{color:var(--dim);font-size:13px;font-weight:800;letter-spacing:1.6px;padding:18px 24px 4px}
  .ri{display:flex;align-items:center;gap:20px;padding:16px 24px}
  .ri + .ri{border-top:1px solid var(--line)}
  .ri .ic{color:var(--dim)}
  .ri .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ri .tx{flex:1;font-size:22px;font-weight:500}
  .ri .go{color:var(--dim)}
  .ri .go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="os">
  <div class="stage">
    <div class="screen" style="overflow:hidden">
      <div class="search">
        <div class="glogo"><span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span></div>
        <div class="brandline">Warivo OS · the only window to the web on this device</div>

        <div class="searchbar">
          <div class="mag"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
          <div class="q">charging stations near me<span class="caret"></span></div>
          <div class="lens"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg></div>
          <div class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg></div>
        </div>

        <div class="chips">
          <div class="chip-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>Weather</div>
          <div class="chip-btn"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-10a6 6 0 1 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>Directions home</div>
          <div class="chip-btn"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>Nearest charger</div>
          <div class="chip-btn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>News</div>
        </div>

        <div class="card recents">
          <div class="rl">RECENT SEARCHES</div>
          <div class="ri"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="tx">e-scooter battery care tips</div><div class="go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div></div>
          <div class="ri"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="tx">weather Bengaluru today</div><div class="go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div></div>
          <div class="ri"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="tx">60V lithium range calculator</div><div class="go"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOP STATUS -->
  <div class="topbar">
    <div class="clock"><span class="t">14:32</span><span class="d">Sun · 21 Sep · 29°C</span></div>
    <div class="sp"></div>
    <div class="stat">
      <div class="chip live"><span class="dot"></span>Warivo-Node</div>
      <div class="sig">
        <svg class="on" viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-10a6 6 0 1 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M6.5 7.5 17 17l-5 4V3l5 4-10.5 9.5"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
      <div class="avatar">W</div>
    </div>
  </div>

  <!-- DOCK -->
  <div class="dock">
    <div class="dock-apps">
      <a href="00-home.html" class="brand"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="none" stroke="#FFC0CB" stroke-width="7"/><polyline points="30,42 44,82 60,54 76,82 90,42" fill="none" stroke="#FFC0CB" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="00-home.html" class="tile"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg></a>
      <a href="02-dashboard.html" class="tile"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4.5-3.5"/><circle cx="12" cy="15" r="1.3"/></svg></a>
      <a href="03-map.html" class="tile"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg></a>
      <a href="04-music.html" class="tile"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></a>
      <a href="05-search.html" class="tile active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></a>
      <a href="09-controls.html" class="tile"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></a>
      <a href="06-settings.html" class="tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a>
    </div>
    <div class="dock-ctrl">
      <div class="ctrl on"><svg viewBox="0 0 24 24"><path d="M2 8h3M2 12h4M2 16h3"/><path d="M9 6a6 6 0 0 1 0 12h-1V6z"/></svg></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <div class="sep"></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8M20 5a9 9 0 0 1 0 14"/></svg></div>
    </div>
  </div>
</div>
<script src="fit.js"></script>
<script src="actions.js"></script>
</body>
</html>
