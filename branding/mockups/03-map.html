<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Warivo OS — Navigation</title>
<link rel="stylesheet" href="warivo.css"/>
<style>
  .map{position:absolute;inset:0}
  .map svg{width:100%;height:100%;display:block}
  .road{fill:none;stroke:#132548;stroke-linecap:round;stroke-linejoin:round}
  .road.major{stroke:#1b3160;stroke-width:22}
  .road.mid{stroke:#172a52;stroke-width:14}
  .road.minor{stroke:#132247;stroke-width:8}
  .park{fill:#123a34;opacity:.5}
  .water{fill:#0c2b46;opacity:.75}
  .route-glow{fill:none;stroke:#FFC0CB;stroke-width:26;stroke-linecap:round;stroke-linejoin:round;opacity:.22;filter:blur(6px)}
  .route{fill:none;stroke:url(#rt);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}

  /* Google-style search pill, top center */
  .gsearch{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:25;
    width:620px;height:64px;border-radius:34px;display:flex;align-items:center;gap:14px;
    padding:0 10px 0 22px;background:rgba(20,40,82,.82);border:1px solid var(--line);
    box-shadow:0 16px 40px rgba(2,8,22,.5);backdrop-filter:blur(20px)}
  .gsearch .g{display:flex}
  .gsearch .txt{flex:1;font-size:22px;font-weight:600;color:var(--dim)}
  .gsearch .mic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--aqua),var(--aqua-deep))}
  .gsearch .mic svg{width:24px;height:24px;stroke:#05102A;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .maneuver{position:absolute;top:96px;left:26px;z-index:20;display:flex;align-items:center;gap:20px;
    padding:22px 30px 22px 22px;border-radius:28px;
    background:linear-gradient(160deg, rgba(22,44,90,.92), rgba(10,26,58,.86));
    border:1px solid var(--line);box-shadow:0 22px 50px rgba(2,8,22,.55);backdrop-filter:blur(20px)}
  .maneuver .arw{width:86px;height:86px;border-radius:24px;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--aqua),var(--aqua-deep))}
  .maneuver .arw svg{width:50px;height:50px;stroke:#05102A;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .maneuver .m-dist{font-size:44px;font-weight:800;line-height:1}
  .maneuver .m-dist span{font-size:22px;color:var(--dim)}
  .maneuver .m-road{font-size:23px;font-weight:600;margin-top:4px}
  .maneuver .m-then{font-size:15px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:8px}
  .maneuver .m-then svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .eta{position:absolute;left:26px;bottom:132px;z-index:20;display:flex;align-items:center;gap:24px;
    padding:18px 30px;border-radius:26px;
    background:linear-gradient(160deg, rgba(22,44,90,.92), rgba(10,26,58,.86));
    border:1px solid var(--line);box-shadow:0 22px 50px rgba(2,8,22,.55);backdrop-filter:blur(20px)}
  .eta .e-min{font-size:44px;font-weight:800;line-height:1;color:var(--aqua)}
  .eta .e-min span{font-size:20px;color:var(--dim);font-weight:700}
  .eta .e-sub{font-size:18px;color:var(--dim);font-weight:600}
  .eta .e-sub b{color:var(--text)}
  .eta .e-x{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,107,125,.16);color:var(--red);margin-left:4px}
  .eta .e-x svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

  .speed-pill{position:absolute;right:26px;bottom:132px;z-index:20;width:116px;height:116px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%, rgba(22,44,90,.96), rgba(10,26,58,.92));
    border:2px solid rgba(255,143,168,.4);box-shadow:0 18px 40px rgba(2,8,22,.55);backdrop-filter:blur(14px)}
  .speed-pill .s{font-size:50px;font-weight:800;line-height:1}
  .speed-pill .l{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--dim);margin-top:2px}

  .recenter{position:absolute;right:26px;top:96px;z-index:20;width:60px;height:60px;border-radius:20px;
    display:grid;place-items:center;background:rgba(20,40,82,.85);border:1px solid var(--line);color:var(--aqua)}
  .recenter svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mini-clock{position:absolute;top:24px;left:30px;z-index:20;font-size:22px;font-weight:800}
</style>
</head>
<body>
<div class="os">
  <div class="stage">
    <div class="map">
      <svg viewBox="0 0 1500 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="rt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8FA8"/><stop offset="1" stop-color="#FFC0CB"/></linearGradient>
          <radialGradient id="mapbg" cx="55%" cy="40%" r="80%"><stop offset="0" stop-color="#0c2350"/><stop offset="1" stop-color="#050f26"/></radialGradient>
        </defs>
        <rect x="0" y="0" width="1500" height="900" fill="url(#mapbg)"/>
        <path class="water" d="M0 620 Q 300 560 520 640 T 1040 660 Q 1300 690 1500 620 L1500 900 L0 900 Z"/>
        <rect class="park" x="120" y="120" width="240" height="180" rx="18"/>
        <rect class="park" x="1060" y="180" width="300" height="230" rx="22"/>
        <rect class="park" x="640" y="90" width="180" height="120" rx="16"/>
        <path class="road major" d="M-20 300 H1520"/><path class="road major" d="M-20 520 H1520"/>
        <path class="road major" d="M420 -20 V920"/><path class="road major" d="M980 -20 V920"/>
        <path class="road mid" d="M-20 180 H1520"/><path class="road mid" d="M-20 700 H1520"/>
        <path class="road mid" d="M200 -20 V920"/><path class="road mid" d="M700 -20 V920"/><path class="road mid" d="M1240 -20 V920"/>
        <path class="road minor" d="M-20 400 H1520"/><path class="road minor" d="M560 -20 V920"/>
        <path class="road minor" d="M840 -20 V920"/><path class="road minor" d="M1100 -20 V920"/>
        <path class="road minor" d="M300 180 L560 400"/><path class="road minor" d="M980 520 L1240 700"/>
        <path class="route-glow" d="M470 820 V520 H420 V300 Q420 210 560 180 H980"/>
        <path class="route" d="M470 820 V520 H420 V300 Q420 210 560 180 H980"/>
        <g transform="translate(980,180)">
          <path d="M0 -34 C -22 -34 -34 -18 -34 0 C -34 26 0 46 0 46 C 0 46 34 26 34 0 C 34 -18 22 -34 0 -34 Z" fill="#FF6B7D"/>
          <circle cx="0" cy="0" r="12" fill="#05102A"/>
        </g>
        <g transform="translate(470,820)">
          <circle r="46" fill="rgba(255,143,168,.18)"/>
          <path d="M0 -34 L20 22 L0 8 L-20 22 Z" fill="#FFC0CB" stroke="#05102A" stroke-width="3"/>
        </g>
      </svg>
    </div>

    <div class="mini-clock">14:32</div>

    <!-- Google search -->
    <a href="05-search.html" class="gsearch">
      <div class="g">
        <svg width="26" height="26" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.8-.4-4H24v7.3h12c-.2 1.9-1.6 4.7-4.6 6.6l6.6 5.1C41.9 41.6 45 33.6 45 24z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.6-5.1c-1.8 1.2-4.2 2.1-7.9 2.1-6 0-11.1-4-12.9-9.5l-6.9 5.3C7.4 40.9 15.1 46 24 46z"/><path fill="#FBBC05" d="M11.1 28.2c-.5-1.4-.7-2.9-.7-4.2s.3-2.8.7-4.2l-6.9-5.3C2.8 17.3 2 20.5 2 24s.8 6.7 2.2 9.5l6.9-5.3z"/><path fill="#EA4335" d="M24 10.5c3.3 0 5.6 1.4 6.9 2.6l5.8-5.7C33.1 4.2 28.9 2 24 2 15.1 2 7.4 7.1 4.2 14.5l6.9 5.3C12.9 14.5 18 10.5 24 10.5z"/></svg>
      </div>
      <div class="txt">Search here — cafés, chargers, addresses…</div>
      <div class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg></div>
    </a>

    <div class="recenter"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>

    <div class="maneuver">
      <div class="arw"><svg viewBox="0 0 24 24"><path d="M9 20V10a4 4 0 0 1 4-4h6"/><path d="M15 2l5 4-5 4"/></svg></div>
      <div>
        <div class="m-dist">400<span> m</span></div>
        <div class="m-road">Turn right onto MG Road</div>
        <div class="m-then"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Then continue for 2.1 km</div>
      </div>
    </div>

    <div class="eta">
      <div class="e-min">14<span> min</span></div>
      <div class="e-sub"><b>5.2 km</b> · arrive 14:46</div>
      <div class="e-x"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    </div>

    <div class="speed-pill"><div class="s">42</div><div class="l">KM/H</div></div>
  </div>

  <!-- TOP STATUS (compact, right side only) -->
  <div class="topbar" style="background:none;justify-content:flex-end">
    <div class="stat">
      <div class="chip live"><span class="dot"></span>GPS lock</div>
      <div class="sig">
        <svg class="on" viewBox="0 0 24 24"><path d="M6.5 7.5 17 17l-5 4V3l5 4-10.5 9.5"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
      <div class="avatar">W</div>
    </div>
  </div>

  <!-- DOCK -->
  <div class="dock">
    <div class="dock-apps">
      <a href="00-home.html" class="brand"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="none" stroke="#FFC0CB" stroke-width="7"/><polyline points="30,42 44,82 60,54 76,82 90,42" fill="none" stroke="#FFC0CB" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <a href="00-home.html" class="tile"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg></a>
      <a href="02-dashboard.html" class="tile"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4.5-3.5"/><circle cx="12" cy="15" r="1.3"/></svg></a>
      <a href="03-map.html" class="tile active"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg></a>
      <a href="04-music.html" class="tile"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></a>
      <a href="05-search.html" class="tile"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></a>
      <a href="09-controls.html" class="tile"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></a>
      <a href="06-settings.html" class="tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a>
    </div>
    <div class="dock-ctrl">
      <div class="ctrl on"><svg viewBox="0 0 24 24"><path d="M2 8h3M2 12h4M2 16h3"/><path d="M9 6a6 6 0 0 1 0 12h-1V6z"/></svg></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <div class="sep"></div>
      <div class="ctrl"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l6 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8M20 5a9 9 0 0 1 0 14"/></svg></div>
    </div>
  </div>
</div>
<script src="fit.js"></script>
<script src="actions.js"></script>
</body>
</html>
