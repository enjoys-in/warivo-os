<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Warivo">
  <title>Warivo mark</title>
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E45"/>
      <stop offset="1" stop-color="#05102A"/>
    </linearGradient>
    <linearGradient id="wm-aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FF0DE"/>
      <stop offset="1" stop-color="#1FB6C9"/>
    </linearGradient>
  </defs>
  <!-- Deep Space Blue tile -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#wm-bg)"/>
  <rect x="4.5" y="4.5" width="111" height="111" rx="27.5" fill="none" stroke="#1FB6C9" stroke-opacity="0.35"/>
  <!-- Celestial Aqua orbit ring -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="url(#wm-aqua)" stroke-opacity="0.28" stroke-width="2"/>
  <!-- W monogram -->
  <polyline points="30,42 44,82 60,54 76,82 90,42" fill="none"
            stroke="url(#wm-aqua)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
