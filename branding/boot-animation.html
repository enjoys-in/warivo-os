<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#03081C"/>
<title>Warivo OS — Boot</title>
<style>
  :root{
    --space-1:#0A1B40; --space-2:#061230; --space-3:#03081C;
    --aqua:#37E0D0; --aqua-2:#1FB6C9;
    --ink:#EAF2FF; --muted:#8FB0D8; --dim:#5E7BA6;
    --t: 1;           /* global speed multiplier (higher = slower) */
  }
  @font-face{
    font-family:'Warivo Script';
    src:url('fonts/KaushanScript-Regular.ttf') format('truetype');
    font-display:swap;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 36%, var(--space-1) 0%, var(--space-2) 55%, var(--space-3) 100%);
    color:var(--ink);
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .stage{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:min(3.2vh,34px);
  }

  /* Emblem: orbit ring + W monogram */
  .emblem{position:relative; width:min(30vmin,270px); aspect-ratio:1/1; display:grid; place-items:center}
  .emblem::before{ /* soft glow */
    content:""; position:absolute; inset:-30%;
    background:radial-gradient(circle, rgba(47,211,200,.35), rgba(47,211,200,0) 70%);
    opacity:0; animation:glow calc(1.2s * var(--t)) ease-out .4s forwards;
  }
  .emblem svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
  .ring{
    fill:none; stroke:url(#g-aqua); stroke-width:4; stroke-linecap:round;
    stroke-dasharray:258; stroke-dashoffset:258;
    animation:draw calc(1.0s * var(--t)) cubic-bezier(.4,0,.2,1) .2s forwards;
  }
  .mono{
    fill:none; stroke:url(#g-aqua); stroke-width:9; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:150; stroke-dashoffset:150;
    animation:draw calc(1.1s * var(--t)) cubic-bezier(.4,0,.2,1) .5s forwards;
  }

  /* Signature wordmark — handwritten, writes on left→right */
  .signature{
    position:relative; font-family:'Warivo Script','Segoe Script',cursive;
    font-size:min(28vmin,230px); line-height:.9; color:var(--ink);
    padding:0 .14em .1em; white-space:nowrap;
    filter:drop-shadow(0 6px 26px rgba(47,211,200,.22));
  }
  .signature .ink{
    display:inline-block;
    clip-path:inset(0 100% -22% -14%);
    animation:write calc(1.7s * var(--t)) cubic-bezier(.66,0,.34,1) 1.4s forwards;
  }
  .signature .pen{
    position:absolute; top:56%; left:2%; width:12px; height:12px; border-radius:50%;
    background:#EAFFFB; box-shadow:0 0 16px 5px rgba(55,224,208,.85);
    opacity:0; animation:pen calc(1.7s * var(--t)) cubic-bezier(.66,0,.34,1) 1.4s forwards;
  }
  .underline{
    width:min(42vmin,360px); height:5px; border-radius:3px;
    background:linear-gradient(90deg,var(--aqua),var(--aqua-2));
    transform:scaleX(0); transform-origin:center;
    animation:sweep calc(.5s * var(--t)) cubic-bezier(.3,0,0,1) 3.1s forwards;
  }
  .model{
    font-size:min(4.2vmin,36px); font-weight:600; letter-spacing:.6em; color:var(--muted);
    padding-left:.6em; opacity:0; animation:fade calc(.5s * var(--t)) ease 3.4s forwards;
  }

  /* OS boot progress — indeterminate bar (system style, not a web spinner) */
  .loader{
    position:absolute; bottom:9vh; display:flex; flex-direction:column; align-items:center; gap:16px;
    opacity:0; animation:fade calc(.6s * var(--t)) ease 3.6s forwards;
  }
  .bar{
    width:min(34vmin,300px); height:4px; border-radius:2px;
    background:rgba(55,224,208,.14); overflow:hidden; position:relative;
  }
  .bar span{
    position:absolute; inset:0 auto 0 0; width:36%; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--aqua), var(--aqua-2));
    animation:indeterminate 1.25s cubic-bezier(.65,.05,.35,1) infinite;
  }
  .loader .os{font-size:min(2.4vmin,19px); font-weight:600; letter-spacing:.42em; color:#4C688F; padding-left:.42em}

  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes glow{to{opacity:1}}
  @keyframes write{to{clip-path:inset(0 -14% -22% -14%)}}
  @keyframes pen{0%{opacity:0;left:2%}10%{opacity:1}90%{opacity:1;left:97%}100%{opacity:0;left:97%}}
  @keyframes sweep{to{transform:scaleX(1)}}
  @keyframes fade{to{opacity:1}}
  @keyframes indeterminate{0%{transform:translateX(-115%)}100%{transform:translateX(315%)}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-delay:0s !important}
    .signature,.model,.loader{opacity:1; transform:none}
    .signature .ink{clip-path:none}
    .underline{transform:scaleX(1)} .ring,.mono{stroke-dashoffset:0}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="emblem">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="g-aqua" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5FF0DE"/>
            <stop offset="1" stop-color="#1FB6C9"/>
          </linearGradient>
        </defs>
        <circle class="ring" cx="60" cy="60" r="41"/>
        <polyline class="mono" points="30,42 44,82 60,54 76,82 90,42"/>
      </svg>
    </div>

    <div class="signature" aria-label="Warivo"><span class="ink">Warivo</span><span class="pen"></span></div>
    <div class="underline"></div>
    <div class="model">NOVA-S</div>

    <div class="loader">
      <div class="bar"><span></span></div>
      <div class="os">WARIVO OS</div>
    </div>
  </div>

  <script>
    // Add ?loop to the URL to replay continuously (handy while designing).
    if (new URLSearchParams(location.search).has('loop')) {
      setInterval(() => {
        const stage = document.querySelector('.stage');
        stage.replaceWith(stage.cloneNode(true));
      }, 7500);
    }
  </script>
</body>
</html>
